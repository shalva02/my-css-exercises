<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="title">Information!</div>

    <div class="wrapper">
      <div class="items">
        <img src="./images/barberry.png" alt="barberry" />
        <div class="text">This is a type of plant. We love this one.</div>
      </div>
      <div class="items">
        <img
          src="./images/chilli.png"
          alt="Chilli pepper plant with vibrant red peppers among green leaves, showing culinary appeal and garden vitality"
        />
        <div class="text">This is another type of plant. Isn't it nice?</div>
      </div>
      <div class="items">
        <img
          src="./images/pepper.png"
          alt="Bell pepper plant displaying glossy yellow or red peppers on green stems, representing fresh produce abundance"
        />
        <div class="text">We have so many plants. Yay plants.</div>
      </div>
      <div class="items">
        <img
          src="./images/saffron.png"
          alt="Saffron crocus flower with delicate purple petals and prominent red stigma, evoking exotic spice and botanical elegance"
        />
        <div class="text">I'm running out of things to say about plants.</div>
      </div>
    </div>

    <!-- disregard this section, it's here to give attribution to the creator of these icons -->
